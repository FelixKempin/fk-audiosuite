# Release-Builds der DAW FK Audio Suite für Linux und Windows, mit den mitgelieferten Lite-Plugins
# als fertige Release-Pakete aus dem öffentlichen Bucket (dist/bundled-plugins.lock, fetch-plugins).
#
# Auslöser:
#   - von Hand (Actions → Release → Run workflow)
#   - Tag fk-audio-suite/<version>, z. B. fk-audio-suite/0.6.0
#
# Baut mit denselben Skripten wie lokal (dist/release-linux.sh, dist/release-windows.ps1); das Ergebnis
# (AppImage, Installer, Zip, .sha256, Manifeste) hängt als Artefakt am Lauf. Veröffentlicht wird
# außerhalb dieses Repos.
#
# Linux auf Ubuntu 22.04 mit GCC 13 (glibc 2.35, libstdc++ statisch, CMakeLists.txt). Das Repo ist
# öffentlich, ebenso die Logs: Hier wird nie Code aus dem privaten Plugin-Repo gebaut.
name: Release

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: "Welche Plattformen"
        type: choice
        options: [beide, linux, windows]
        default: beide
  push:
    tags: ["fk-audio-suite/*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux:
    name: Linux (Ubuntu 22.04, GCC 13)
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.platforms == 'beide' || inputs.platforms == 'linux' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    env:
      FK_BUILD_JOBS: 4
      CC: gcc-13
      CXX: g++-13
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: FKAudioSuite
          submodules: recursive

      - name: Abhängigkeiten
        run: |
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-13 g++-13 ninja-build \
            libasound2-dev libjack-jackd2-dev \
            libfreetype-dev libfontconfig1-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxext-dev \
            libgl1-mesa-dev libcurl4-openssl-dev libgtk-3-dev \
            ladspa-sdk lv2-dev xvfb openbox file
          cmake --version | head -1

      - name: Bauen, testen, verpacken
        working-directory: FKAudioSuite
        run: |
          xvfb-run -a sh -c 'openbox & sleep 2; dist/release-linux.sh'

      - name: Laufzeit prüfen (höchste glibc-Version, keine libstdc++)
        working-directory: FKAudioSuite
        run: |
          app=$(find build -type f -name 'FK Audio Suite' -perm -u+x | head -1)
          [[ -n "$app" ]] || { echo "::error::Programm nicht gefunden"; exit 1; }
          echo "== $app: höchste glibc $(objdump -T "$app" | grep -o 'GLIBC_[0-9.]*' | sort -Vu | tail -1)"
          if ldd "$app" | grep -q libstdc++; then echo "::error::hängt an libstdc++"; exit 1; fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-x64
          path: |
            FKAudioSuite/dist/out/*.AppImage
            FKAudioSuite/dist/out/*.sha256
            FKAudioSuite/dist/out/*.json
          if-no-files-found: error
          retention-days: 30

  windows:
    name: Windows (MSVC, Inno Setup)
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.platforms == 'beide' || inputs.platforms == 'windows' }}
    runs-on: windows-2022
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: FKAudioSuite
          submodules: recursive

      - name: Inno Setup
        shell: pwsh
        run: |
          $iscc = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe") | Where-Object { Test-Path $_ }
          if (-not $iscc) { choco install innosetup -y --no-progress }

      - name: Bauen, testen, verpacken
        shell: pwsh
        working-directory: FKAudioSuite
        env:
          # Signieren nur, wenn eingerichtet (dist/windows/sign.ps1 im DAW-Repo); sonst unsigniert.
          FK_SIGN_ENDPOINT: ${{ vars.FK_SIGN_ENDPOINT }}
          FK_SIGN_ACCOUNT: ${{ vars.FK_SIGN_ACCOUNT }}
          FK_SIGN_PROFILE: ${{ vars.FK_SIGN_PROFILE }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          & dist\release-windows.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-x64
          path: |
            FKAudioSuite/dist/out/*.exe
            FKAudioSuite/dist/out/*.zip
            FKAudioSuite/dist/out/*.sha256
            FKAudioSuite/dist/out/*.json
          if-no-files-found: error
          retention-days: 30
