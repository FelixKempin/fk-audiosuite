# CI: baut FK Audio Suite und lässt alle Tests laufen. Push auf main und Pull Requests bauen Linux,
# wenn sich Code oder Build geändert hat; Windows läuft von Hand (Actions → CI → Run workflow,
# Häkchen "windows"). Pakete baut der Workflow "Release". Pull Requests aus Forks laufen ohne Secrets
# und mit einem Token, das nur lesen darf.
name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "dist/**"
      - ".github/workflows/release.yml"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "dist/**"
      - ".github/workflows/release.yml"
  workflow_dispatch:
    inputs:
      windows:
        description: "Auch Windows bauen und testen"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux (GCC, Release)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive

      - name: Kein Produkt-Code im öffentlichen Repo
        run: dist/check-open-source.sh

      - name: Abhängigkeiten
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build ccache xvfb openbox \
            libasound2-dev libjack-jackd2-dev \
            libfreetype-dev libfontconfig1-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxext-dev \
            libgl1-mesa-dev libcurl4-openssl-dev libgtk-3-dev \
            ladspa-sdk lv2-dev

      - name: ccache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ccache
          key: ccache-linux-${{ github.sha }}
          restore-keys: ccache-linux-

      - name: Konfigurieren
        run: cmake --preset ci-linux -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_C_COMPILER_LAUNCHER=ccache

      - name: Bauen
        run: cmake --build --preset ci-linux -j 4

      # Mit Fenstermanager: ohne ihn fehlen die _NET_WM-Atome, und JUCE setzt beim ersten Fenster
      # eine Eigenschaft mit Atom 0 - der X-Server beendet den Prozess (BadAtom).
      - name: Tests (virtueller Bildschirm)
        run: xvfb-run -a sh -c 'openbox & sleep 2; build/ci-linux/tests/fk_tests --reporter compact'

  windows:
    name: Windows (MSVC, Release)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.windows }}
    runs-on: windows-2022
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive

      - name: Konfigurieren
        run: cmake --preset windows-release

      - name: Bauen
        run: cmake --build --preset windows-release --parallel

      - name: Tests
        run: build\windows-release\tests\Release\fk_tests.exe --reporter compact
